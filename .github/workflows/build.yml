name: Build

# Skip build + verify (+ EAP) when a change touches only docs. Any non-doc file still triggers a
# full run. Not a required check, so a skipped docs-only PR still merges. workflow_dispatch always
# runs (no path filter).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  checks: write # for the test-results check on PRs

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      eap: ${{ steps.ver.outputs.eap }}
      tag: ${{ steps.ver.outputs.tag }}
      target: ${{ steps.ver.outputs.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # On main, record the dependency graph of this build. The dependency-graph job submits
          # it, so this job keeps a read-only token.
          dependency-graph: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'generate-and-upload' || 'disabled' }}

      # On main, build the EAP version here, so the eap job publishes this zip and does not build
      # again. Version <VERSION>-eap.<yyyyMMdd>.<run>, tag eap-<yyyyMMdd>.<run>.
      - name: Compute EAP version
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          date="$(date -u +%Y%m%d)"
          target="$(cat VERSION)"
          eap="${target}-eap.${date}.${{ github.run_number }}"
          {
            echo "eap=$eap"
            echo "tag=eap-${date}.${{ github.run_number }}"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
          echo "EAP_VERSION=$eap" >> "$GITHUB_ENV"

      - name: Test, verify & build
        # verifyPluginStructure also catches a bad EAP version string.
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin ${EAP_VERSION:+-PpluginVersion="$EAP_VERSION"} --stacktrace

      # Compatibility check at PR time, against the current Rider only (one IDE download). Same
      # version as above, so the plugin zip is not built again.
      - name: Verify plugin compatibility (current Rider)
        run: ./gradlew verifyPlugin -PverifierIdes=current ${EAP_VERSION:+-PpluginVersion="$EAP_VERSION"} --stacktrace

      - name: Upload verifier report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() # report even when tests fail
        with:
          name: Test results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/test/**
          if-no-files-found: warn

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: build/distributions/*.zip
          if-no-files-found: error

  # Every successful build on main is published as an EAP pre-release (GitHub only, NOT the
  # Marketplace) so you can download the zip and install it in Rider for testing. The plugin
  # version is <VERSION>-eap.<yyyyMMdd>.<run> (VERSION holds the next release), so it sorts above
  # the last release and installs over it. The build job builds that zip; this job publishes it.
  eap:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the pre-release + tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags + history for the "PRs since last release" list

      - name: Download EAP plugin
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}
          path: build/distributions

      - name: Collect PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git tag -l 'v*' | sort -V | tail -1)"
          query="is:pr is:merged base:main"
          if [ -n "$last" ]; then
            since="$(git log -1 --format=%cd --date=format:%Y-%m-%d "$last")"
            query="$query merged:>$since"
            echo "base=$last" >> "$GITHUB_OUTPUT"
          else
            echo "base=(none)" >> "$GITHUB_OUTPUT"
          fi
          list="$(gh pr list --search "$query" --json number,title --jq '.[] | "- #\(.number) \(.title)"')"
          [ -z "$list" ] && list="_(no merged PRs found)_"
          {
            echo "list<<PRS_EOF"
            echo "$list"
            echo "PRS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish EAP pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "EAP ${{ needs.build.outputs.target }} · ${{ needs.build.outputs.tag }}"
          prerelease: true
          files: build/distributions/*.zip
          body: |
            **Early-access (EAP) dev build - target version `${{ needs.build.outputs.target }}`.**
            Not published to the JetBrains Marketplace. For local testing only.

            Plugin version: `${{ needs.build.outputs.eap }}`. Uninstall it before installing a Marketplace release.

            ### Install
            Download the `.zip` below, then in Rider:
            **Settings → Plugins → ⚙ → Install Plugin from Disk…**, pick the zip, and restart.

            ### PRs since ${{ steps.prs.outputs.base }}
            ${{ steps.prs.outputs.list }}

  # Submits the dependency graph the build job recorded. It replaces GitHub's automatic dependency
  # submission, which resolved every dependency again in a job of its own. No checkout: it runs no
  # repository code, so the write token stays away from the build.
  dependency-graph:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dependency Submission API
    steps:
      - name: Submit dependency graph
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
